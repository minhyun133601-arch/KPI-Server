<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KPI Server Repository Map</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --surface: #ffffff;
      --line: #d8e0ec;
      --text: #172033;
      --muted: #5f6b7c;
      --blue: #2563eb;
      --green: #16803c;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans KR", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.5;
    }

    .page {
      width: min(1180px, calc(100% - 28px));
      margin: 24px auto;
      display: grid;
      gap: 14px;
    }

    header,
    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    header {
      display: grid;
      gap: 8px;
      padding: 18px;
      border-top: 4px solid var(--blue);
    }

    .eyebrow {
      color: var(--blue);
      font-size: 0.75rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      font-size: clamp(1.7rem, 3vw, 2.4rem);
      letter-spacing: 0;
    }

    .subtitle,
    .panel-copy,
    .role {
      color: var(--muted);
    }

    .nav-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    .nav-row a,
    button {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--text);
      padding: 7px 10px;
      font: inherit;
      font-size: 0.82rem;
      font-weight: 850;
      text-decoration: none;
      cursor: pointer;
    }

    .nav-row a:hover,
    button:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }

    .panel {
      overflow: hidden;
      border-top: 4px solid var(--green);
    }

    .panel-head {
      display: grid;
      gap: 4px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: #f9fbff;
    }

    .panel-title {
      font-size: 1rem;
      font-weight: 900;
    }

    .body {
      padding: 14px 16px 16px;
    }

    .status-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      padding: 2px 8px;
      font-size: 0.72rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .badge.live {
      border-color: #bfdbfe;
      background: #eff6ff;
      color: #1d4ed8;
    }

    .badge.data {
      border-color: #bbf7d0;
      background: #f0fdf4;
      color: #15803d;
    }

    .tree,
    .tree ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .tree ul {
      margin: 5px 0 3px 16px;
      padding-left: 12px;
      border-left: 1px solid var(--line);
    }

    .tree li {
      padding: 5px 0;
    }

    .tree-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .tree-actions button {
      min-height: 30px;
      padding: 5px 9px;
      font-size: 0.76rem;
    }

    .tree-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .tree-label {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px;
      min-width: 0;
    }

    .tree-toggle {
      flex: 0 0 auto;
      width: 24px;
      min-width: 24px;
      min-height: 24px;
      border-color: #bfdbfe;
      background: #eff6ff;
      color: var(--blue);
      padding: 0;
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 0.78rem;
      line-height: 1;
    }

    .tree-toggle[aria-expanded="true"]::before {
      content: "v";
    }

    .tree-toggle[aria-expanded="false"]::before {
      content: ">";
    }

    .tree-leaf {
      display: flex;
      align-items: baseline;
      gap: 6px;
      min-width: 0;
    }

    .tree-children {
      margin: 5px 0 3px 16px;
      padding-left: 12px;
      border-left: 1px solid var(--line);
    }

    .path {
      font-family: Consolas, "SFMono-Regular", monospace;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .role {
      font-size: 0.84rem;
      font-weight: 650;
    }

    .feedback {
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 700;
    }

    @media (max-width: 880px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="eyebrow">KPI Server</div>
      <h1>Repository Map</h1>
      <p class="subtitle">폴더 구조만 보여주는 저장소 지도입니다.</p>
      <nav class="nav-row" aria-label="Repository map links">
        <button id="refreshButton" type="button">Refresh folder map</button>
      </nav>
    </header>

    <section class="layout">
      <article class="panel">
        <div class="panel-head">
          <h2 class="panel-title">Folder Structure</h2>
          <p class="panel-copy">Live owner-console API를 우선 사용하고, API가 없으면 정적 구조를 표시합니다.</p>
        </div>
        <div class="body">
          <div class="status-row">
            <span id="sourceBadge" class="badge live">loading</span>
            <span class="badge data">Repository tab only</span>
          </div>
          <div class="tree-actions" aria-label="Folder tree controls">
            <button id="expandAllButton" type="button">Expand all</button>
            <button id="collapseAllButton" type="button">Collapse all</button>
          </div>
          <div id="treeFeedback" class="feedback">Loading repository map.</div>
          <div id="treeHost"></div>
        </div>
      </article>

    </section>
  </main>

  <script src="/repository-map-data.js"></script>
  <script>
    const staticTree = window.KPI_REPOSITORY_MAP_STATIC_TREE || [];
    const isOwnerPage = window.location.pathname.startsWith('/owner/repository-map');
    const ownerMapApiBasePath = isOwnerPage ? '/api/owner/repository-map' : '/api/repository-map';
    const sourceBadge = document.getElementById('sourceBadge');
    const treeFeedback = document.getElementById('treeFeedback');
    const treeHost = document.getElementById('treeHost');
    const expandAllButton = document.getElementById('expandAllButton');
    const collapseAllButton = document.getElementById('collapseAllButton');

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function normalizeLiveNode(node) {
      return {
        path: node?.path || node?.name || '',
        role: node?.descKo || node?.desc || node?.labelKo || node?.label || '',
        children: Array.isArray(node?.children) ? node.children.map(normalizeLiveNode) : [],
      };
    }

    function shouldShowNodeRole(node, depth) {
      return Boolean(node?.role) && depth <= 1;
    }

    function renderTree(nodes, depth = 0) {
      const items = (Array.isArray(nodes) ? nodes : []).map((node) => {
        const hasChildren = Array.isArray(node.children) && node.children.length;
        const isOpen = depth === 0;
        const role = shouldShowNodeRole(node, depth) ? node.role : '';
        const row = `
          <div class="tree-label">
            <span class="path">${escapeHtml(node.path)}</span>
            ${role ? `<span class="role">${escapeHtml(role)}</span>` : ''}
          </div>
        `;
        if (hasChildren) {
          const toggleLabel = `Toggle ${node.path}`;
          return `
            <li>
              <div class="tree-row tree-branch-row">
                ${row}
                <button class="tree-toggle" type="button" aria-expanded="${isOpen ? 'true' : 'false'}" aria-label="${escapeHtml(toggleLabel)}"></button>
              </div>
              <div class="tree-children" ${isOpen ? '' : 'hidden'}>
                ${renderTree(node.children, depth + 1)}
              </div>
            </li>
          `;
        }
        return `
          <li>
            <div class="tree-leaf">${row}</div>
          </li>
        `;
      }).join('');
      return `<ul class="tree">${items}</ul>`;
    }

    function setTreeOpenState(isOpen) {
      treeHost.querySelectorAll('.tree-toggle').forEach((toggle) => {
        toggle.setAttribute('aria-expanded', String(Boolean(isOpen)));
        const children = toggle.closest('li')?.querySelector(':scope > .tree-children');
        if (children) children.hidden = !isOpen;
      });
    }

    function toggleTreeBranch(toggle) {
      const isOpen = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', String(!isOpen));
      const children = toggle.closest('li')?.querySelector(':scope > .tree-children');
      if (children) children.hidden = isOpen;
    }

    function getRepositoryMapEndpoints() {
      const host = String(window.location.hostname || '').trim();
      const port = isOwnerPage ? '3100' : '3215';
      return Array.from(new Set([
        host ? `http://${host}:${port}${ownerMapApiBasePath}` : '',
        `http://127.0.0.1:${port}${ownerMapApiBasePath}`,
        `http://localhost:${port}${ownerMapApiBasePath}`,
        'http://127.0.0.1:3215/api/repository-map',
        'http://localhost:3215/api/repository-map',
        'http://127.0.0.1:3100/api/owner/repository-map',
        'http://localhost:3100/api/owner/repository-map',
      ].filter(Boolean)));
    }

    async function fetchRepositoryMap() {
      const errors = [];
      for (const endpoint of getRepositoryMapEndpoints()) {
        try {
          const response = await fetch(endpoint, { cache: 'no-store' });
          const payload = await response.json();
          if (response.ok && payload?.ok === true && payload.tree) {
            return { endpoint, tree: [normalizeLiveNode(payload.tree)] };
          }
          errors.push(`${endpoint}: ${payload?.error || response.status}`);
        } catch (error) {
          errors.push(`${endpoint}: ${error.message}`);
        }
      }
      throw new Error(errors.join(' / '));
    }

    async function loadTree() {
      sourceBadge.textContent = 'loading';
      treeFeedback.textContent = 'Loading repository map.';
      try {
        const result = await fetchRepositoryMap();
        sourceBadge.textContent = 'live';
        treeFeedback.textContent = `Loaded from ${result.endpoint}`;
        treeHost.innerHTML = renderTree(result.tree);
      } catch (error) {
        sourceBadge.textContent = 'static';
        treeFeedback.textContent = 'Live API unavailable. Showing static repository structure.';
        treeHost.innerHTML = renderTree(staticTree);
      }
    }

    document.getElementById('refreshButton')?.addEventListener('click', () => {
      void loadTree();
    });

    treeHost.addEventListener('click', (event) => {
      const toggle = event.target.closest('.tree-toggle');
      if (!toggle) return;
      toggleTreeBranch(toggle);
    });

    expandAllButton?.addEventListener('click', () => {
      setTreeOpenState(true);
    });

    collapseAllButton?.addEventListener('click', () => {
      setTreeOpenState(false);
    });

    async function initialize() {
      await loadTree();
    }

    void initialize();
  </script>
</body>
</html>
