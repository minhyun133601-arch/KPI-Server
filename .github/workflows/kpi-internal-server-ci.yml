name: KPI Internal Server CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  verify-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: ./06_★★★_KPI런타임/internal-server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./06_★★★_KPI런타임/internal-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Verify server structure
        run: npm run verify:server-structure

      - name: Run node:test suite
        run: npm test

  browser-smoke:
    needs: verify-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: ./06_★★★_KPI런타임/internal-server
    env:
      KPI_AUTH_ENABLED: "false"
      KPI_LOGIN_ENABLED: "false"
      KPI_SERVER_PORT: "3192"
      KPI_BASE_URL: "http://127.0.0.1:3192"
      KPI_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5434/postgres"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./06_★★★_KPI런타임/internal-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npm run smoke:kpi-browser:install

      - name: Install Xvfb for headed browser smoke
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Verify KPI root static surface (open mode)
        run: npm run smoke:kpi-root

      - name: Run Playwright browser smoke (open mode)
        run: npm run smoke:kpi-browser

      - name: Run Playwright browser smoke headed (open mode)
        run: xvfb-run -a npm run smoke:kpi-browser:headed
