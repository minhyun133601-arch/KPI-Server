version: 2
updates:
  - package-ecosystem: npm
    directory: /kpi-runtime/internal-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      internal-server-npm:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
