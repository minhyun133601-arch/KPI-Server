<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>설비 이력카드</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="title-block">
        <span class="eyebrow">설비 이력카드 TOOL</span>
        <h1>설비 이력카드</h1>
        <p class="subtitle">설비 기본 정보, 첨부 자료, 이력 입력을 한 화면에서 관리합니다.</p>
      </div>
      <div class="actions">
        <button type="button" class="button-link" id="resetPhotos">사진 초기화</button>
          <button type="button" class="button-link" id="resetExploded">분해도 초기화</button>
        <button type="button" class="button-link primary" id="printCard">인쇄 / PDF 저장</button>
      </div>
    </header>

    <section class="layout">
      <div class="info-grid">
        <section class="panel pad">
          <div class="panel-header">
            <h2 class="panel-title">기본 설비 정보</h2>
            <span class="panel-note">현장 입력용</span>
          </div>

          <div class="field-grid">
            <label class="field">
              <span>설비명</span>
              <input type="text" placeholder="예: 코팅기 / 포장기 / 믹서" />
            </label>
            <label class="field">
              <span>관리번호</span>
              <input type="text" placeholder="예: EQ-2026-001" />
            </label>
            <label class="field">
              <span>모델명</span>
              <input type="text" placeholder="예: Model XH-240" />
            </label>
            <label class="field">
              <span>제조사</span>
              <input type="text" placeholder="예: ABC Machinery" />
            </label>
            <label class="field">
              <span>설치일</span>
              <input type="date" />
            </label>
            <label class="field">
              <span>가동상태</span>
              <select>
                <option>정상 가동</option>
                <option>점검 예정</option>
                <option>수리 중</option>
                <option>대기</option>
              </select>
            </label>
          </div>
        </section>

        <aside class="panel pad">
          <div class="panel-header">
            <h2 class="panel-title">운영 위치</h2>
            <span class="panel-note">Team 선택형</span>
          </div>

          <div class="field-grid location-grid">
            <label class="field">
              <span>Team</span>
              <select id="teamSelect">
                <option value="">선택하세요</option>
                <option value="1팀 1파트">1팀 1파트</option>
                <option value="1팀 2파트">1팀 2파트</option>
                <option value="2팀">2팀</option>
                <option value="3팀">3팀</option>
                <option value="공무환경팀">공무환경팀</option>
              </select>
            </label>
            <label class="field">
              <span>Room</span>
              <select disabled>
                <option>추후 설정</option>
              </select>
            </label>
            <label class="field">
              <span>Process</span>
              <select disabled>
                <option>추후 설정</option>
              </select>
            </label>
            <label class="field wide">
              <span>상세 위치 / 설치 구역</span>
              <input type="text" placeholder="예: A동 2층 동측 라인 / 라인 3번" />
            </label>
            <label class="field wide">
              <span>비고</span>
              <textarea placeholder="비고를 적어주세요."></textarea>
            </label>
          </div>
        </aside>
      </div>

      <section class="asset-grid">
        <section class="panel pad collapsible-panel photo-panel">
          <button
            type="button"
            class="collapse-toggle"
            id="togglePhoto"
            aria-expanded="false"
            aria-controls="photoBody"
          >
            <span>설비 사진</span>
            <span class="collapse-arrow" id="photoArrow" aria-hidden="true">&#9660;</span>
          </button>

          <div id="photoBody" hidden>
            <div class="photo-toolbar">
              <div class="photo-chip-row" id="photoPicker">
                <button type="button" class="photo-chip active" data-view="front">정면</button>
                <button type="button" class="photo-chip" data-view="side">측면</button>
                <button type="button" class="photo-chip" data-view="rear">후면</button>
              </div>
            </div>

            <div class="photo-stage-wrap compact">
              <button type="button" class="photo-nav" id="photoPrev" aria-label="이전 방향">&#8249;</button>
              <div class="photo-stage" id="photoStage">
                <span class="photo-stage-label" id="photoViewLabel">정면</span>
                <img class="photo-main-preview" id="photoMainPreview" alt="정면 사진" hidden />
                <button type="button" class="attach-button photo-attach" id="photoAttachButton">첨부</button>
              </div>
              <button type="button" class="photo-nav" id="photoNext" aria-label="다음 방향">&#8250;</button>
            </div>

            <input class="hidden-input" id="photo-front" type="file" accept="image/*" data-view="front" />
            <input class="hidden-input" id="photo-side" type="file" accept="image/*" data-view="side" />
            <input class="hidden-input" id="photo-rear" type="file" accept="image/*" data-view="rear" />
          </div>
        </section>

        <div class="asset-side-stack">
          <section class="panel pad collapsible-panel">
          <button
            type="button"
            class="collapse-toggle"
            id="toggleExploded"
            aria-expanded="false"
            aria-controls="explodedBody"
          >
            <span>분해도</span>
            <span class="collapse-arrow" id="explodedArrow" aria-hidden="true">&#9660;</span>
          </button>

          <div id="explodedBody" hidden>
            <div class="panel-header collapse-header">
              <span class="panel-note">파일 첨부</span>
              <label class="button-link" for="explodedInput">첨부</label>
            </div>

            <div class="file-surface" id="explodedViewer"></div>
            <div class="drawing-status" id="explodedStatus">분해도 파일이 아직 첨부되지 않았습니다.</div>
            <label class="field memo-field">
              <span>메모</span>
              <textarea placeholder="메모를 적어주세요."></textarea>
            </label>
            <input class="hidden-input" id="explodedInput" type="file" accept="image/*,.pdf,application/pdf" />
          </div>
        </section>

          <aside class="panel pad caution-panel collapsible-panel">
          <button
            type="button"
            class="collapse-toggle"
            id="toggleCaution"
            aria-expanded="false"
            aria-controls="cautionBody"
          >
            <span>주의사항</span>
            <span class="collapse-arrow" id="cautionArrow" aria-hidden="true">&#9660;</span>
          </button>

          <div id="cautionBody" hidden>
            <div class="panel-header collapse-header caution-header">
              <span class="panel-note">파일 첨부</span>
              <label class="button-link" for="cautionInput">첨부</label>
            </div>
            <div class="file-surface caution-surface" id="cautionViewer"></div>
            <div class="drawing-status" id="cautionStatus">주의사항 파일이 아직 첨부되지 않았습니다.</div>
            <label class="field memo-field">
              <span>메모</span>
              <textarea placeholder="메모를 적어주세요."></textarea>
            </label>
            <input class="hidden-input" id="cautionInput" type="file" accept="image/*,.pdf,application/pdf" />
          </div>
        </aside>
        </div>
      </section>

      <section class="panel pad">
        <div class="panel-header">
          <h2 class="panel-title">설비 이력</h2>
          <button type="button" class="button-link" id="addHistoryRow">이력 행 추가</button>
        </div>

        <div class="table-wrap">
          <table class="history-table">
            <thead>
              <tr>
                <th>일자</th>
                <th>구분</th>
                <th>내용</th>
                <th>담당자</th>
              </tr>
            </thead>
            <tbody id="historyBody"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <template id="historyRowTemplate">
    <tr>
      <td><input type="date" /></td>
      <td>
        <select>
          <option>점검</option>
          <option>수리</option>
          <option>교체</option>
          <option>개선</option>
          <option>기타</option>
        </select>
      </td>
      <td><input type="text" placeholder="작업 내용 또는 이상 사항을 입력하세요." /></td>
      <td><input type="text" placeholder="담당자" /></td>
    </tr>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
