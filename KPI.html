    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; margin: 0; padding: 0; overflow: hidden; color: #0f172a; }
        
        /* === 대시보드 (표지) === */
        #dashboard { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 45%, #e2e8f0 100%);
            z-index: 50; transition: transform 0.4s ease-in-out; overflow-y: auto;
        }
        #dashboard.hidden-view { transform: translateY(-100%); }
        #dashboard::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.08), transparent 35%),
                radial-gradient(circle at 85% 5%, rgba(14, 165, 233, 0.08), transparent 30%),
                linear-gradient(transparent 0, transparent 96%, rgba(148, 163, 184, 0.18) 100%);
            pointer-events: none;
        }
        #dashboard > * { position: relative; }
        #dashboard .text-white { color: #0f172a !important; }
        #dashboard .text-slate-400 { color: #475569 !important; }
        #dashboard .text-slate-500 { color: #64748b !important; }
        #dashboard .bg-blue-900 { background-color: #e0e7ff !important; }
        #dashboard .text-blue-100 { color: #1e3a8a !important; }
        #dashboard .border-blue-700 { border-color: #c7d2fe !important; }

            width: min(1440px, 96%);
            min-height: calc(100vh - 44px);
            display: grid;
            grid-template-columns: 272px minmax(0, 1fr);
            gap: 1.2rem;
            padding: 22px 0;
        }

            padding: 1.35rem 1rem 1rem;
            border-radius: 28px;
            border: 1px solid rgba(226, 232, 240, 0.95);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.96) 0%, rgba(248, 250, 252, 0.92) 100%);
            box-shadow: 0 24px 48px -34px rgba(15, 23, 42, 0.28);
            min-height: 100%;

            justify-content: space-between;
            gap: 0.85rem;

            line-height: 1.5;
        }
        .dashboard-version-badge {

            justify-content: center;

            min-height: 44px;

        .dashboard-side-button {

            align-items: center;

        .dashboard-side-footer {

        .runtime-auth-meta {

            padding: 0.45rem 0.6rem;
            border-left: 1px solid #e2e8f0;
            background: #f8fafc;
        }
        .runtime-auth-meta[hidden] {
            display: none !important;
        }
        .runtime-auth-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            background: #eff6ff;

        }
        .runtime-auth-id {
            color: #475569;
        }
        .runtime-auth-logout {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.42rem;
            flex: 0 0 auto;
            min-height: 100%;
            padding: 0 0.95rem;
            border: 0;
            border-left: 1px solid #e2e8f0;
            background: linear-gradient(180deg, #fff1f2 0%, #ffe4e6 100%);
            color: #9f1239;
            font-size: 0.74rem;
            font-weight: 900;
            cursor: pointer;
            line-height: 1;
            white-space: nowrap;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, color 0.15s ease;
        }
        .runtime-auth-logout i {
            font-size: 0.8rem;
        }
        .runtime-auth-logout-label {
            white-space: nowrap;
        }
        .runtime-auth-logout:hover:not(:disabled) {
            background: linear-gradient(180deg, #ffe4e6 0%, #fecdd3 100%);
            color: #881337;
        }
        .runtime-auth-logout:disabled {
            opacity: 0.7;
            cursor: wait;
        }
        .dashboard-main {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .dashboard-topbar {
            padding: 1.5rem 1.65rem 1.1rem;

            align-items: center;
            justify-content: center;
            gap: 0.38rem;
            height: 34px;
            padding: 0 0.72rem;
            border-radius: 999px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #475569;
            font-size: 0.78rem;
            font-weight: 800;

            background: #f8fbff;
            color: #0f172a;
        }
        .global-save-toolbar-button.is-active {
            border-color: #93c5fd;
            background: #eff6ff;
            color: #1d4ed8;
            box-shadow: 0 12px 22px -18px rgba(37, 99, 235, 0.45);
        }
        .global-save-toolbar-button i {
            font-size: 0.82rem;
        }
        .global-save-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.42rem;
            min-width: 92px;
            height: 34px;
            padding: 0 0.9rem;

            border-color: #166534;

            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);

        /* 메인 바디 (사이드바 + 콘텐츠) */
        .viewer-body { flex: 1; display: flex; overflow: hidden; }
        .viewer-body.is-sidebar-collapsed .sidebar {
            width: 96px;
            min-width: 96px;
            padding-left: 8px;
            padding-right: 8px;
            overflow: hidden;
            pointer-events: auto;
        }
        .viewer-body.is-sidebar-collapsed .content-area {
            padding-left: 1rem;
        }

        /* 사이드바 (카테고리) */
        .sidebar { 
            width: 260px; background: white; border-right: 1px solid #e2e8f0; 
            display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0;
            --sidebar-nav-font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --sidebar-nav-group-size: 15px;
            --sidebar-nav-item-size: 14px;
            --sidebar-nav-item-weight: 700;
        }
        .sidebar-item { 
            padding: 10px 14px 10px 18px; cursor: pointer; border-left: 3px solid transparent; 
            color: #64748b; font-size: var(--sidebar-nav-item-size); font-weight: var(--sidebar-nav-item-weight); transition: all 0.2s;
            display: flex; align-items: center; justify-content: space-between; gap: 0.45rem;
            font-family: var(--sidebar-nav-font-family);
        }
        .sidebar-item-main { display: inline-flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
        .sidebar-item-main span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .sidebar-item-main span:last-child {
            font-family: var(--sidebar-nav-font-family);
            font-size: var(--sidebar-nav-item-size);
            font-weight: var(--sidebar-nav-item-weight);
            line-height: 1.35;
            letter-spacing: -0.01em;
        }
        .sidebar-item i { color: var(--cat-color, #64748b); }
        .sidebar-item:hover { background: #f1f5f9; color: #334155; border-left-color: var(--cat-color, #cbd5e1); }
        .sidebar-item.active { 
            background: #eef2ff; color: #0f172a; border-left-color: var(--cat-color, #2563eb); 
        }
        .sidebar-item-report {
            flex: 0 0 auto; border: 1px solid #cbd5e1; background: white; color: #475569;
            border-radius: 999px; padding: 4px 9px; font-size: 0.72rem; font-weight: 800;
            line-height: 1; transition: all 0.18s; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
        }
        .sidebar-item-report:hover {
            border-color: var(--cat-color, #94a3b8);
            background: color-mix(in srgb, var(--cat-color, #94a3b8) 12%, white);
            color: #0f172a;
        }
        .sidebar-item.active .sidebar-item-report {
            border-color: color-mix(in srgb, var(--cat-color, #94a3b8) 45%, #cbd5e1);
            background: color-mix(in srgb, var(--cat-color, #94a3b8) 10%, white);
        }
        .sidebar {
            width: 286px;
            padding: 14px 12px;
            gap: 10px;
            background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
            transition: width 0.22s ease, padding 0.22s ease, border-color 0.22s ease, opacity 0.18s ease;
        }
        .sidebar-tree-shell {
            display: grid;
            gap: 6px;
            padding-bottom: 10px;
        }
        .sidebar-viewer-toggle {
            --cat-color: #475569;
            --cat-soft: #f1f5f9;
        }
        .sidebar-viewer-toggle .sidebar-group-toggle-main {
            justify-content: center;
        }
        .viewer-body.is-sidebar-collapsed .sidebar-tree-shell {
            gap: 0;
        }
        .viewer-body.is-sidebar-collapsed .sidebar-group {
            display: none;
        }
        .viewer-body.is-sidebar-collapsed .sidebar-reset-row {
            display: none;
        }
        .viewer-body.is-sidebar-collapsed .sidebar-viewer-toggle {
            padding-left: 8px;
            padding-right: 8px;
        }
        .viewer-body.is-sidebar-collapsed .sidebar-viewer-toggle .sidebar-group-toggle-main {
            justify-content: center;
            gap: 6px;
        }
        .viewer-body.is-sidebar-collapsed .sidebar-viewer-toggle .sidebar-group-label {
            font-size: 13px;
        }
        .sidebar-group {
            display: grid;
            gap: 4px;
        }
        .sidebar-group-toggle {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            color: #0f172a;
            text-align: left;
            font: inherit;
            font-family: var(--sidebar-nav-font-family);
            cursor: pointer;
            appearance: none;
            transition: all 0.18s ease;
        }
        .sidebar-group-toggle:hover,
        .sidebar-group-toggle.is-active,
        .sidebar-group.is-expanded .sidebar-group-toggle {
            border-color: var(--cat-color, #2563eb);
            background: color-mix(in srgb, var(--cat-soft, #eff6ff) 75%, #ffffff);
            box-shadow: 0 18px 28px -28px rgba(15, 23, 42, 0.5);
        }
        .sidebar-group-toggle-main {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }
        .sidebar-group-icon {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: color-mix(in srgb, var(--cat-soft, #eff6ff) 84%, #ffffff);
            color: var(--cat-color, #2563eb);
            flex: 0 0 auto;
        }
        .sidebar-group-label {
            color: #0f172a;
            font-family: var(--sidebar-nav-font-family);
            font-size: var(--sidebar-nav-group-size);
            font-weight: 800;
            line-height: 1.35;
            letter-spacing: -0.01em;
        }
        .sidebar-group-chevron {
            color: #94a3b8;
            font-size: 0.72rem;
            transition: transform 0.18s ease, color 0.18s ease;
            flex: 0 0 auto;
        }
        .sidebar-group.is-expanded .sidebar-group-chevron {
            color: var(--cat-color, #2563eb);
            transform: rotate(90deg);
        }
        .sidebar-group-items {
            display: none;
            gap: 4px;
            margin-left: 18px;
            padding: 2px 0 2px 12px;
            border-left: 1px dashed #dbe3ee;
        }
        .sidebar-group.is-expanded .sidebar-group-items {
            display: grid;
        }
        .sidebar-reset-row {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed #dbe3ee;
        }
        .sidebar-item.sidebar-item-nested {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid transparent;
            border-left: 0;
            border-radius: 12px;
            background: transparent;
            text-align: left;
            font: inherit;
            font-family: var(--sidebar-nav-font-family);
            appearance: none;
        }
        .sidebar-item.sidebar-item-nested:hover {
            border-left-color: transparent;
            border-color: rgba(148, 163, 184, 0.28);
            background: #f8fafc;
        }
        .sidebar-item.sidebar-item-nested.active {
            border-left-color: transparent;
            border-color: color-mix(in srgb, var(--cat-color, #2563eb) 50%, #e2e8f0);
            background: color-mix(in srgb, var(--cat-color, #2563eb) 9%, #ffffff);
            color: #0f172a;
            box-shadow: 0 14px 24px -26px rgba(15, 23, 42, 0.48);
        }
        .sidebar-item.sidebar-item-nested.active .sidebar-item-main span:last-child,
        .sidebar-item.sidebar-item-nested.active .sidebar-item-main i {
            color: var(--cat-color, #2563eb);
        }
        .sidebar-item.sidebar-item-nested.active .sidebar-item-main span:last-child {
            font-weight: 800;
        }
        .sidebar-item.sidebar-item-reset {
            border-color: #e2e8f0;
            background: #ffffff;
            box-shadow: 0 12px 22px -22px rgba(15, 23, 42, 0.28);
            --cat-color: #475569;
        }
        .sidebar-item.sidebar-item-reset:hover {
            border-color: #cbd5e1;
            background: #f8fafc;
        }
        .sidebar-item.sidebar-item-team {
            margin-left: 12px;
            padding: 7px 10px 7px 12px;
            border-radius: 10px;
        }
        .sidebar-item.sidebar-item-team .sidebar-item-main {
            gap: 8px;
        }
        .sidebar-item.sidebar-item-team .sidebar-item-main span:last-child {
            font-size: var(--sidebar-nav-item-size);
            font-weight: var(--sidebar-nav-item-weight);
        }
        .sidebar-mode-toggle-row {
            display: flex;
            justify-content: flex-end;
            padding: 0.3rem 0 0 1.6rem;
        }
        .sidebar-mode-toggle-button {
            min-width: 34px;
            height: 34px;
            padding: 0 10px;
            border: 1px solid #dbe3ee;
            border-radius: 8px;
            background: #ffffff;
            color: #475569;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font: inherit;
            appearance: none;
            box-shadow: 0 12px 22px -20px rgba(15, 23, 42, 0.36);
            cursor: pointer;
            transition: border-color 140ms ease, background 140ms ease, color 140ms ease, transform 140ms ease;
        }
        .sidebar-mode-toggle-button:hover {
            border-color: #94a3b8;
            background: #f8fafc;
            color: #0f172a;
            transform: translateY(-1px);
        }
        .sidebar-mode-toggle-button.is-group {
            border-color: #bfdbfe;
            background: #eff6ff;
            color: #1d4ed8;
        }
        .sidebar-mode-toggle-button.is-process {
            border-color: #fde68a;
            background: #fffbeb;
            color: #b45309;
        }
        .sidebar-mode-toggle-text {
            font-size: 12px;
            font-weight: 700;
            line-height: 1;
            white-space: nowrap;
        }

        /* 콘텐츠 영역 */
        .content-area { flex: 1; padding: 1.35rem; overflow-y: auto; background: #f5f7fb; }
        .content-area.content-area-full-bleed { padding: 0; overflow-x: hidden; overflow-y: auto; background: #ffffff; }
        .content-card { 
            background: white; border-radius: 1.1rem; box-shadow: 0 18px 34px -34px rgba(15, 23, 42, 0.46); 
            border: 1px solid #e2e8f0;
            padding: 1.85rem; max-width: none; margin: 0; min-height: calc(100vh - 118px);
            animation: fadeIn 0.3s ease-out;
        }
        .content-card.content-card-full-bleed {
            max-width: none; margin: 0; min-height: 100%; height: auto;
            padding: 0; border-radius: 0; box-shadow: none; background: #ffffff;
        }
        .viewer-home-shell {
            width: 100%;
            min-height: calc(100vh - 60px);
            height: auto;
            position: relative;
            overflow: visible;
            box-sizing: border-box;
            padding: clamp(12px, 1.7vw, 24px) clamp(22px, 2.8vw, 38px) clamp(14px, 1.9vw, 26px);
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            align-content: center;
            gap: clamp(14px, 1.6vh, 22px);
            background:
                radial-gradient(circle at 18% 18%, rgba(148, 215, 193, 0.22) 0, rgba(148, 215, 193, 0) 24%),
                radial-gradient(circle at 88% 14%, rgba(135, 191, 255, 0.18) 0, rgba(135, 191, 255, 0) 28%),
                radial-gradient(circle at 74% 92%, rgba(209, 232, 255, 0.22) 0, rgba(209, 232, 255, 0) 30%),
                linear-gradient(180deg, #f6f9fc 0%, #fdfefe 44%, #eef4f7 100%);
            isolation: isolate;
        }
        .viewer-home-shell::before {
            content: "";
            position: absolute;
            top: 56px;
            right: min(3vw, 36px);
            width: min(38vw, 540px);
            height: min(15vw, 210px);
            background-image: var(--viewer-home-logo);
            background-repeat: no-repeat;
            background-size: contain;
            background-position: center;
            opacity: 0.045;
            transform: rotate(-6deg);
            pointer-events: none;
            z-index: 0;
        }
        .viewer-home-shell::after {
            content: "";
            position: absolute;
            inset: auto 40px 26px auto;
            width: 320px;
            height: 320px;
            border-radius: 999px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.7) 0, rgba(255, 255, 255, 0) 70%);
            pointer-events: none;
            z-index: 0;
        }
        .viewer-home-hero,
        .viewer-home-guideline-section {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1260px;
            margin: 0 auto;
        }
        .viewer-home-hero {
            display: grid;
            grid-template-columns: minmax(340px, 500px) minmax(0, 1fr);
            align-items: center;
            gap: clamp(28px, 3.5vw, 54px);
            min-height: 0;
        }
        .viewer-home-brand-panel {
            display: grid;
            align-content: center;
            justify-items: stretch;
            max-width: min(100%, 500px);
        }
        .viewer-home-brand-frame {
            position: relative;
            display: grid;
            place-items: center;
            min-height: clamp(220px, 22vw, 300px);
            padding: clamp(24px, 2.7vw, 34px);
            border-radius: 32px;
            border: 1px solid rgba(203, 213, 225, 0.78);
            overflow: hidden;
            background:
                radial-gradient(circle at 16% 18%, rgba(148, 215, 193, 0.22) 0, rgba(148, 215, 193, 0) 34%),
                radial-gradient(circle at 84% 16%, rgba(191, 219, 254, 0.26) 0, rgba(191, 219, 254, 0) 36%),
                linear-gradient(145deg, rgba(255, 255, 255, 0.98) 0%, rgba(245, 249, 255, 0.95) 55%, rgba(236, 244, 251, 0.92) 100%);
            box-shadow: 0 34px 74px -54px rgba(15, 23, 42, 0.38);
        }
        .viewer-home-brand-frame::before {
            content: "";
            position: absolute;
            inset: 24px auto auto 26px;
            width: 110px;
            height: 110px;
            border-radius: 999px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.76) 0, rgba(255, 255, 255, 0) 72%);
            pointer-events: none;
        }
        .viewer-home-brand-frame::after {
            content: "";
            position: absolute;
            inset: 10px;
            border-radius: 20px;
            border: 1px solid rgba(226, 232, 240, 0.92);
            pointer-events: none;
        }
        .viewer-home-brand-logo {
            display: block;
            width: 100%;
            max-width: min(100%, 430px);
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 12px 22px rgba(30, 79, 151, 0.08));
        }
        .viewer-home-copy-panel {
            display: grid;
            gap: 14px;
            align-content: center;
            width: min(100%, 760px);
            justify-self: end;
            padding: clamp(8px, 1.5vw, 16px) 0;
        }
        .viewer-home-context-chip {
            width: fit-content;
            max-width: 100%;
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.7rem 1rem;
            border-radius: 999px;
            border: 1px solid rgba(191, 219, 254, 0.92);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.94) 0%, rgba(239, 246, 255, 0.94) 100%);
            box-shadow: 0 16px 30px -24px rgba(37, 99, 235, 0.36);
        }
        .viewer-home-context-icon {
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            font-size: 0.96rem;
            box-shadow: 0 14px 28px -22px rgba(37, 99, 235, 0.78);
            flex: 0 0 auto;
        }
        .viewer-home-context-text {
            min-width: 0;
            color: #1e3a5f;
            font-size: 0.92rem;
            font-weight: 900;
            letter-spacing: -0.03em;
            line-height: 1.2;
            white-space: nowrap;
        }
        .viewer-home-policy-title {
            margin: 0;
            color: #0f172a;
            font-size: clamp(3rem, 5.2vw, 4.8rem);
            font-weight: 900;
            letter-spacing: -0.06em;
            line-height: 0.98;
        }
        .viewer-home-policy-rule {
            width: min(100%, 640px);
            height: 1px;
            background: linear-gradient(90deg, rgba(148, 163, 184, 0) 0%, rgba(148, 163, 184, 0.86) 18%, rgba(148, 163, 184, 0.86) 82%, rgba(148, 163, 184, 0) 100%);
            margin: 4px 0 8px;
        }
        .viewer-home-policy-points {
            display: grid;
            gap: 12px;
        }
        .viewer-home-policy-line {
            margin: 0;
            display: flex;
            align-items: center;
            gap: 14px;
            color: #17212b;
            font-size: clamp(1.22rem, 1.86vw, 2rem);
            font-weight: 800;
            letter-spacing: -0.05em;
            line-height: 1.3;

        .print-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; border-bottom: 1px solid #e2e8f0; padding-bottom: 6px; margin-bottom: 6px; }

        .print-summary span { background: #f1f5f9; padding: 4px 8px; border-radius: 999px; }
        .print-table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 9.5px; table-layout: fixed; }
        .print-table th,
        .print-table td { border: 1px solid #e2e8f0; padding: 3px 5px; vertical-align: top; line-height: 1.2; }
        .print-table th { background: #f8fafc; font-weight: 700; text-align: left; }
        .print-col-date { width: 10%; }
        .print-col-team { width: 12%; }
        .print-col-room { width: 12%; }
        .print-col-owner { width: 14%; }
        .print-col-task { width: 52%; }

        .print-table td { word-break: keep-all; }
        .print-sheet[data-mode="audit"] .print-table td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
        .print-sheet[data-mode="util"] .print-title { color: #0f766e; }

        .print-sheet[data-mode="util"] .print-table th { background: #e0f2fe; color: #0c4a6e; text-align: center; }
        .print-sheet[data-mode="util"] .print-table td { font-variant-numeric: tabular-nums; text-align: center; }
        .print-sheet[data-mode="util"] .print-table td:last-child { text-align: right; }
        .print-sheet[data-mode="util"] .print-col-date,

        @media print {
